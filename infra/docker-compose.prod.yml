services:
  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    image: obra_web:prod                 # ← Etiquetamos la imagen para reutilizarla
    env_file:
      - /opt/obra_mvp/deploy/.env.prod
    command: bash -c "cd /app/backend && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 2 --timeout 60"
    volumes:
      - /opt/obra_mvp:/app               # ← MISMO mapeo que usarán worker/beat
      - static_data:/app/staticfiles
      - media_data:/app/media
    expose:
      - "8000"
    depends_on:
      - db
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - /opt/obra_mvp/deploy/.env.prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 20s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - /opt/obra_mvp/deploy/.env.prod
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - static_data:/srv/static
      - media_data:/srv/media
      - /opt/www:/srv/site:ro
    depends_on:
      - web
  
  web-preview:
    profiles: ["preview"]
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    env_file:
      - /opt/obra_mvp/deploy/.env.prod
    volumes:
      - ../:/app
      - static_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -lc "python manage.py runserver 0.0.0.0:8001 --insecure"
    ports:
      - "8001:8001"
    mem_limit: 256m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    image: obra_web:prod                 # ← Reusa la imagen de web (no build aquí)
    command: celery -A config.celery_app worker -l info
    restart: unless-stopped
    env_file:
      - /opt/obra_mvp/deploy/.env.prod   # ← Mismas variables que web (DJANGO_SETTINGS_*, etc.)
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      - redis
      - web
    volumes:
      - /opt/obra_mvp:/app               # ← Igual que web para compartir el código

  beat:
    image: obra_web:prod                 # ← Reusa la imagen de web (no build aquí)
    command: celery -A config.celery_app beat -l info
    restart: unless-stopped
    env_file:
      - /opt/obra_mvp/deploy/.env.prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      - redis
      - worker
    volumes:
      - /opt/obra_mvp:/app               # ← Igual que web

volumes:
  pgdata:
  static_data:
  media_data:
  caddy_data:
  caddy_config:
