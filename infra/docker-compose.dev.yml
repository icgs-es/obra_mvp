services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: obradb
      POSTGRES_USER: obradb
      POSTGRES_PASSWORD: obradb
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
    ports: [ "5432:5432" ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obradb -d obradb"]
      interval: 10s
      timeout: 5s
      retries: 5
  pgadmin:
    image: dpage/pgadmin4:8
    depends_on: [ db ]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports: [ "5050:80" ]
    volumes: [ "pgadmin:/var/lib/pgadmin" ]
  web:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    working_dir: /app/backend
    command: sh -lc "python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DB_NAME: obradb
      DB_USER: obradb
      DB_PASSWORD: obradb
      DB_HOST: db
      DB_PORT: "5432"
    volumes: [ "../backend:/app/backend" ]
    ports: [ "8001:8000" ]
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
  pgadmin:
