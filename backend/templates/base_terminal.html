{# templates/base_terminal.html #}
<!doctype html>
<html lang="es">
  <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <title>{% block title %}Terminal de fichaje — Intasa{% endblock %}</title>

      {% load static %}
      <link rel="icon" type="image/png" sizes="192x192" href="{% static 'portal/icons/icon-192.png' %}">

      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
      <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

      <style>
        body {
          background: #0f172a;  /* fondo oscuro tipo app */
          color: #e5e7eb;
        }
        .terminal-wrapper {
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 1.5rem;
        }
        .terminal-card {
          width: 100%;
          max-width: 480px;
        }
      </style>

      {% block head %}{% endblock %}
  </head>
  <body>
    <div class="terminal-wrapper">
      <main class="terminal-card">
        {% if messages %}
          <div class="mb-3">
            {% for message in messages %}
              <div class="alert alert-{{ message.tags|default:'info' }} mb-2" role="alert">
                {{ message }}
              </div>
            {% endfor %}
          </div>
        {% endif %}

        {% block content %}{% endblock %}
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    {% block scripts %}{% endblock %}
  </body>
</html>
