<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Intasa Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #34495e;
            --accent-color: #3498db;
        }
        
        body {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
            max-width: 400px;
            width: 100%;
        }
        
        .login-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .login-body {
            padding: 30px;
        }
        
        .btn-login {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            padding: 12px;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <h3><i class="fas fa-building me-2"></i>Intasa Platform</h3>
            <p class="mb-0">Sistema de gestión integral</p>
        </div>
        
        <div class="login-body">
            {% if form.errors %}
            <div class="alert alert-danger alert-dismissible fade show" role="alert">
                <strong>Error:</strong> Usuario o contraseña incorrectos.
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                        <input type="text" name="username" class="form-control" placeholder="Nombre de usuario" required autofocus>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="Contraseña" required>
                    </div>
                </div>
                
                <div class="d-grid">
                    <button type="submit" class="btn btn-login text-white">
                        <i class="fas fa-sign-in-alt me-2"></i>Iniciar Sesión
                    </button>
                </div>
            </form>
            
            <hr class="my-4">
            
            <div class="text-center">
                <p class="text-muted mb-2">¿Necesitas acceso?</p>
                <div class="d-flex justify-content-center gap-2">
                    <a href="/admin/login/" class="btn btn-sm btn-outline-secondary">
                        <i class="fas fa-cog me-1"></i>Admin
                    </a>
                    <a href="/" class="btn btn-sm btn-outline-primary">
                        <i class="fas fa-home me-1"></i>Inicio
                    </a>
                    <a href="/app/obra-movil/" href="/app/obra-movil/" class="btn btn-sm btn-outline-warning">🏗️ Obra móvil</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- OBRA_MOVIL_UX0_LOGIN_SHORTCUT_V1 -->




<!-- LOGIN_OBRA_MOVIL_BOTON_OK -->

<!-- LOGIN_OBRA_MOVIL_SIN_PANEL_LATERAL_OK -->
<style>
  .login-obm-direct-hide {
    display: none !important;
  }
</style>
<script>
(function () {
  function ready(fn) {
    if (document.readyState !== "loading") fn();
    else document.addEventListener("DOMContentLoaded", fn);
  }

  ready(function () {
    var phrases = [
      "Acceso directo de obra",
      "Entra con usuario",
      "abre directamente Obra móvil",
      "abre directamente Obra movil",
      "Entrar a Obra móvil",
      "Entrar a Obra movil"
    ];

    Array.prototype.slice.call(document.querySelectorAll("body *")).forEach(function (el) {
      var txt = (el.innerText || el.textContent || "");

      if (!phrases.some(function (p) { return txt.indexOf(p) !== -1; })) return;

      var node = el;

      for (var i = 0; i < 8 && node && node !== document.body; i++) {
        var tag = String(node.tagName || "").toUpperCase();
        var cls = String(node.className || "").toLowerCase();

        if (
          ["ASIDE", "SECTION", "ARTICLE"].indexOf(tag) !== -1 ||
          cls.indexOf("card") !== -1 ||
          cls.indexOf("direct") !== -1 ||
          cls.indexOf("obra") !== -1 ||
          cls.indexOf("side") !== -1 ||
          cls.indexOf("right") !== -1
        ) {
          node.classList.add("login-obm-direct-hide");
          return;
        }

        node = node.parentElement;
      }

      el.classList.add("login-obm-direct-hide");
    });
  });
})();
</script>

</body>
</html>
