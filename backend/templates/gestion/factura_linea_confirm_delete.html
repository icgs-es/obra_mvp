{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-3">
  <div class="card shadow-sm border-0">
    <div class="card-body">
      <h1 class="h5">Eliminar línea de factura</h1>
      <p>
        ¿Seguro que quieres eliminar la línea
        <strong>{{ linea.linea }}</strong>
        de la factura <strong>{{ factura.cod_factura }}</strong>?
      </p>

      <form method="post">
        {% csrf_token %}
        <a href="{% if request.GET.next %}{{ request.GET.next }}{% else %}/app/gestion/facturas/{{ factura.id }}/{% endif %}" class="btn btn-outline-secondary">Cancelar</a>
        <button class="btn btn-danger">Eliminar línea</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
