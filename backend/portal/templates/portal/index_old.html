{% extends "base.html" %}
{% block title %}Mi jornada{% endblock %}
{% block content %}
<div class="container">
  <h1 class="mb-3">Mi jornada</h1>
  <p class="text-muted">Último acceso: {{ now|date:"d/m/Y H:i" }}</p>

  <div class="grid" style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
    <section class="card p-3" style="border:1px solid #eee;border-radius:12px;">
      <h2 class="h5">Accesos rápidos</h2>
      <ul>
        <li><a href="{% url 'tareas:list' %}">Tareas</a></li>
        <li><a href="{% url 'agenda:list' %}">Agenda (calendario)</a></li>
      </ul>
    </section>
    <section class="card p-3" style="border:1px solid #eee;border-radius:12px;">
      <h2 class="h5">Hoy</h2>
      <p>Bienvenido, {{ request.user.get_username }}.</p>
      <p><a class="btn btn-primary" href="{% url 'agenda:create' %}">Nuevo evento</a></p>
    </section>
  </div>
</div>
{% endblock %}
