{% extends "base.html" %}

{% block title %}Renombrar archivo — {{ archivo.nombre_original }}{% endblock %}

{% block content %}
<div class="container my-4">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h1 class="h5 mb-3">Renombrar archivo</h1>

          <p class="small text-muted">
            Carpeta: <strong>{{ carpeta.get_ruta_display }}</strong>
          </p>

          <form method="post" novalidate>
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ request.GET.next }}">

            <div class="mb-3">
              <label class="form-label" for="id_nombre_original">Nombre del archivo</label>
              <input type="text"
                     id="id_nombre_original"
                     name="nombre_original"
                     value="{{ archivo.nombre_original }}"
                     class="form-control">
            </div>

            <div class="d-flex justify-content-between">
              <a href="{{ cancel_url }}" class="btn btn-outline-secondary">
                Cancelar
              </a>
              <button type="submit" class="btn btn-primary">
                Guardar cambios
              </button>
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
