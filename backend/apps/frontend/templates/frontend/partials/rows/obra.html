
<tr id="row-obra-{{ r.id }}">
  <td>{{ r.id }}</td>
  <td class="mono">{{ r.codigo }}</td>
  <td>{{ r.nombre }}</td>
  <td class="actions">
    <a hx-get="{% url 'obra_edit' r.id %}" hx-target="#row-obra-{{ r.id }}" hx-swap="outerHTML">Editar</a>
    <form method="post" style="display:inline" hx-post="{% url 'obra_delete' r.id %}" hx-target="#tabcontent" hx-swap="outerHTML">
      {% csrf_token %}
      <button type="submit" onclick="return confirm('¿Eliminar obra {{ r.codigo }}?')">Borrar</button>
    </form>
  </td>
</tr>
