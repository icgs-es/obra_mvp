
<article class="span-12">
  <header><strong>Nueva Partida</strong></header>
  <form method="post" class="grid" hx-post="{% url 'tab_partidas' %}" hx-target="#tabcontent" hx-swap="outerHTML">
    {% csrf_token %}
    <label class="span-6">Capítulo {{ form.capitulo }}</label>
    <label class="span-6">Nombre {{ form.nombre }}</label>
    <div class="span-12"><button type="submit">Guardar</button></div>
  </form>
</article>

<form class="span-12" hx-get="{% url 'tab_partidas' %}" hx-target="#tabcontent" hx-swap="outerHTML">
  <label>Obra
    <select name="obra">
      <option value="">— Todas —</option>
      {% for o in obras %}
        <option value="{{ o.id }}" {% if obra_id == o.id %}selected{% endif %}>{{ o }}</option>
      {% endfor %}
    </select>
  </label>
  <label>SubObra
    <select name="subobra">
      <option value="">— Todas —</option>
      {% for so in subobras %}
        <option value="{{ so.id }}" {% if subobra_id == so.id %}selected{% endif %}>{{ so }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Capítulo
    <select name="capitulo">
      <option value="">— Todos —</option>
      {% for c in capitulos %}
        <option value="{{ c.id }}" {% if capitulo_id == c.id %}selected{% endif %}>{{ c }}</option>
      {% endfor %}
    </select>
  </label>
  <button type="submit">Filtrar</button>
  <a href="#" hx-get="{% url 'tab_partidas' %}" hx-target="#tabcontent">Limpiar</a>
</form>

<div class="table-scroll">
  <table role="grid">
    <thead><tr><th>ID</th><th>Obra</th><th>SubObra</th><th>Capítulo</th><th>Partida</th><th class="actions">Acciones</th></tr></thead>
    <tbody>
    {% for r in rows %}
      {% include "frontend/partials/rows/partida.html" with r=r %}
    {% empty %}
      <tr><td colspan="6">Sin partidas</td></tr>
    {% endfor %}
    </tbody>
  </table>
</div>
