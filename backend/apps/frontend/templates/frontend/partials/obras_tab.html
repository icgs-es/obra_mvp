
<article class="span-12">
  <header><strong>Nueva Obra</strong></header>
  <form method="post" class="grid" hx-post="{% url 'tab_obras' %}" hx-target="#tabcontent" hx-swap="outerHTML">
    {% csrf_token %}
    <label class="span-3">Código {{ form.codigo }}</label>
    <label class="span-6">Nombre {{ form.nombre }}</label>
    <div class="span-12"><button type="submit">Guardar</button></div>
  </form>
</article>

<form class="span-12" hx-get="{% url 'tab_obras' %}" hx-target="#tabcontent" hx-swap="outerHTML">
  <input type="search" name="q" value="{{ q|default:'' }}" placeholder="Buscar código o nombre">
  <button type="submit">Filtrar</button>
  <a href="#" hx-get="{% url 'tab_obras' %}" hx-target="#tabcontent">Limpiar</a>
</form>

<div class="table-scroll">
  <table role="grid">
    <thead><tr><th>ID</th><th>Código</th><th>Nombre</th><th class="actions">Acciones</th></tr></thead>
    <tbody>
    {% for r in rows %}
      {% include "frontend/partials/rows/obra.html" with r=r %}
    {% empty %}
      <tr><td colspan="4">Sin obras</td></tr>
    {% endfor %}
    </tbody>
  </table>
</div>
