{% extends "base.html" %}
{% block title %}Importar eventos{% endblock %}
{% block content %}
<div class="card">
  <div class="card-body">
    <h4>Importar CSV</h4>
    <p>Cabeceras soportadas: <code>titulo, inicio, fin, all_day, visibilidad, ubicacion, notas</code>.</p>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <input type="file" name="file" accept=".csv" class="form-control" required>
      <div class="mt-3">
        <button class="btn btn-primary">Importar</button>
        <a class="btn btn-secondary" href="{% url 'agenda:home' %}">Volver</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
