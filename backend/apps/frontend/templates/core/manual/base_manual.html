<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Constructora · Manual{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-white border-bottom">
  <div class="container">
    <a class="navbar-brand" href="{% url 'construccion:home' %}">
      <i class="bi bi-hammer me-2"></i>Constructora
    </a>
    <ul class="navbar-nav ms-3">
      <li class="nav-item"><a class="nav-link" href="{% url 'construccion:home' %}">Manual</a></li>
      <li class="nav-item"><a class="nav-link" href="{% url 'construccion:tabs' %}">Tabs</a></li>
    </ul>
    <div class="ms-auto d-flex gap-2">
      <a class="btn btn-outline-secondary btn-sm" href="/"><i class="bi bi-house me-1"></i>Inicio</a>
      <a class="btn btn-primary btn-sm" href="/app/"><i class="bi bi-speedometer2 me-1"></i>Portal</a>
    </div>
  </div>
</nav>

<main class="container my-4">
  <div class="card">
    <div class="card-body">
      {% block content %}{% endblock %}
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
