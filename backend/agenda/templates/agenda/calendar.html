{% extends "base.html" %}
{% block title %}Agenda{% endblock %}

{% block content %}
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/locales-all.global.min.js"></script>

<style>
  .fc { --fc-border-color:#e5e7eb; --fc-page-bg-color:#fff; }
  .card{ border:1px solid #e5e7eb; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.04); }
  .card-body{ padding:.75rem; }
  .filters{
    display:flex; gap:.75rem; align-items:center;
    margin-bottom:.75rem; flex-wrap:wrap;
    padding:.25rem .25rem .75rem;
    border-bottom:1px solid #e5e7eb;
  }
  .left-tools{display:flex; gap:.5rem; align-items:center;}
  .filters .chip{display:inline-flex;align-items:center;gap:.35rem;border:1px solid #d1d5db;border-radius:999px;padding:.3rem .6rem}
  .filters .chip input{transform:translateY(1px)}
  .right-tools{ margin-left:auto; display:flex; gap:.5rem; }

  .right-tools .btn{
    border-radius:10px;
    padding:.35rem .65rem;
    font-weight:600;
  }
  .right-tools .btn-primary{
    box-shadow:0 2px 6px rgba(37,99,235,.18);
  }

  /* Contenedor FullCalendar más "app" */
  #calendar .fc-view-harness{
    border-radius:12px;
    overflow:hidden;
  }

  /* Barra superior FC */
  #calendar .fc-toolbar{
    margin: .75rem 0 .75rem 0;
  }

  /* Botones FC más tipo app */
  #calendar .fc .fc-button{
    border-radius:10px;
    padding:.35rem .6rem;
    font-weight:600;
  }

  /* Título centrado más sobrio */
  #calendar .fc-toolbar-title{
    font-size: 1.25rem;
    font-weight: 700;
  }
</style>

<div class="card">
  <div class="card-body">
    <div class="filters">
      <div class="left-tools">
        <strong style="font-size:14px;">Agenda</strong>
      </div>
      <label class="chip"><input type="checkbox" id="f-mis"> Mis</label>
      <label class="chip"><input type="checkbox" id="f-depto"> Depto</label>
      <label class="chip"><input type="checkbox" id="f-global"> Global</label>

      <div class="right-tools">
        <a class="btn btn-sm btn-primary" href="{% url 'agenda:create' %}">
          + Nuevo evento
        </a>

        <a class="btn btn-sm btn-outline-secondary" href="{% url 'agenda:import' %}">
          Importar
        </a>

        <a class="btn btn-sm btn-outline-secondary" href="{% url 'agenda:export' %}">
          Exportar
        </a>
      </div>
    </div>
    <div id="calendar"></div>
  </div>
</div>

<!-- Modal: Nuevo evento rápido -->
<div class="modal fade" id="quickEventModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content" style="border-radius:14px;">
      <div class="modal-header">
        <h5 class="modal-title">Nuevo evento</h5>
        <button id="qe-close" type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>

      <div class="modal-body">
        <div class="mb-2">
          <label class="form-label">Título</label>
          <input id="qe-title" type="text" class="form-control" placeholder="Título del evento">
        </div>

        <div class="row g-2">
          <div class="col-6">
            <label class="form-label">Inicio</label>
            <input id="qe-start" type="datetime-local" class="form-control">
          </div>
          <div class="col-6">
            <label class="form-label">Fin</label>
            <input id="qe-end" type="datetime-local" class="form-control">
          </div>
        </div>

        <div class="form-check mt-2">
          <input id="qe-allDay" class="form-check-input" type="checkbox">
          <label class="form-check-label" for="qe-allDay">Todo el día</label>
        </div>

        <div class="mt-2">
          <label class="form-label">Ubicación (opcional)</label>
          <input id="qe-location" type="text" class="form-control" placeholder="Sala / Dirección / Link">
        </div>
      </div>

      <div class="modal-footer">
        <button id="qe-save" type="button" class="btn btn-primary">Guardar</button>
        <button id="qe-cancel" type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
      </div>
    </div>
  </div>
</div>

<script>
console.log("AGENDA: script cargado");

(function(){
  const calendarEl = document.getElementById("calendar");
  if (!calendarEl) {
    console.warn("AGENDA: no existe #calendar");
    return;
  }

  // ✅ Diagnóstico inmediato
  console.log("AGENDA: FullCalendar =", typeof FullCalendar);
  console.log("AGENDA: bootstrap =", typeof bootstrap);

  // Si FullCalendar no cargó, muestro error visible
  if (typeof FullCalendar === "undefined") {
    calendarEl.innerHTML =
      '<div class="alert alert-danger m-2">FullCalendar no está cargado (CDN bloqueado o no llega el JS). Revisa consola.</div>';
    return;
  }

  // --- helpers ---
  function getCookie(name){
    const m = document.cookie.match('(^|;)\\s*'+name+'\\s*=\\s*([^;]+)');
    return m ? m.pop() : '';
  }
  function toLocalInputValue(dateObj){
    const pad = (n) => String(n).padStart(2, "0");
    const y = dateObj.getFullYear();
    const m = pad(dateObj.getMonth() + 1);
    const d = pad(dateObj.getDate());
    const hh = pad(dateObj.getHours());
    const mm = pad(dateObj.getMinutes());
    return `${y}-${m}-${d}T${hh}:${mm}`;
  }

  // --- modal (solo si existe bootstrap) ---
  const modalEl = document.getElementById("quickEventModal");
  const hasBootstrap = (typeof bootstrap !== "undefined" && bootstrap?.Modal);
  const quickModal = (modalEl && hasBootstrap) ? bootstrap.Modal.getOrCreateInstance(modalEl) : null;

  function openQuickModal({start, end, allDay}){
    // si no hay bootstrap, volvemos al formulario clásico
    if (!quickModal) {
      const url = new URL("{% url 'agenda:create' %}", window.location.origin);
      url.searchParams.set("start", start.toISOString());
      url.searchParams.set("end", end.toISOString());
      url.searchParams.set("allDay", allDay ? "1" : "0");
      window.location.href = url.toString();
      return;
    }

    document.getElementById("qe-title").value = "";
    document.getElementById("qe-start").value = toLocalInputValue(start);
    document.getElementById("qe-end").value = toLocalInputValue(end);
    document.getElementById("qe-allDay").checked = allDay === true;
    document.getElementById("qe-location").value = "";
    quickModal.show();
  }

  // --- FullCalendar ---
  const calendar = new FullCalendar.Calendar(calendarEl, {
    locale: "es",
    firstDay: 1,
    initialView: "timeGridWeek",
    headerToolbar: {
      left: "prev,next today",
      center: "title",
      right: "dayGridMonth,timeGridWeek,timeGridDay,listWeek"
    },
    selectable: true,
    selectMirror: true,

    dateClick: function(info){
      const start = info.date;
      const end = new Date(start.getTime() + 60*60*1000);
      openQuickModal({ start, end, allDay: info.allDay === true });
    },
    select: function(info){
      openQuickModal({ start: info.start, end: info.end, allDay: info.allDay === true });
    },

    events: function(fetchInfo, successCallback, failureCallback){
      fetch("{% url 'agenda:api_events' %}?start="+fetchInfo.startStr+"&end="+fetchInfo.endStr,
        {credentials:"same-origin"}
      )
      .then(r => r.ok ? r.json() : Promise.reject(r))
      .then(successCallback)
      .catch(failureCallback);
    }
  });

  // listeners modal (solo si bootstrap está)
  if (modalEl && quickModal){
    modalEl.addEventListener("hidden.bs.modal", () => {
      try { calendar.unselect(); } catch(e) {}
      setTimeout(() => calendarEl.scrollIntoView({block:"nearest"}), 0);
    });
  }

  // Guardar (solo si hay modal)
  const btnSave = document.getElementById("qe-save");
  if (btnSave && quickModal){
    btnSave.addEventListener("click", async () => {
      const title = (document.getElementById("qe-title").value || "").trim();
      const startVal = document.getElementById("qe-start").value;
      const endVal = document.getElementById("qe-end").value;
      const allDay = document.getElementById("qe-allDay").checked;
      const ubicacion = (document.getElementById("qe-location").value || "").trim();

      if (!title) return alert("Escribe un título.");
      if (!startVal) return alert("Selecciona inicio.");

      const startISO = new Date(startVal).toISOString();
      const endISO = endVal ? new Date(endVal).toISOString() : null;

      const resp = await fetch("{% url 'agenda:api_events' %}", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": getCookie("csrftoken")
        },
        credentials: "same-origin",
        body: JSON.stringify({
          title,
          start: startISO,
          end: endISO,
          allDay,
          ubicacion,
          visibilidad: "privada"
        })
      });

      if (!resp.ok) return alert("No se pudo guardar el evento.");

      quickModal.hide();
      calendar.refetchEvents();
    });
  }

  calendar.render();
})();
</script>

{% endblock %}
